# bird_sim configuration — edit and restart to apply.
# Missing sections/keys fall back to built-in defaults.

[flock]
num_birds = 3000
neighbor_count = 7        # topological "magic number" for starlings
separation_dist = 1.1
roost_radius = 55.0       # flock turns back past this distance
max_speed = 2.2
max_force = 0.1
force_separate = 0.7
force_align = 0.4
force_cohere = 0.4
force_roost = 0.03
force_center = 0.2
roost_orbit_radius = 200.0  # meters; roost circles the map at this radius
roost_orbit_speed = 0.1    # rad/s; 0 = static roost
orbit_wobble_radius = 0.4  # secondary wave amplitude, fraction of main radius
orbit_wobble_speed = 1.0   # scales the off-beat wave freqs (x1.37 X, x0.79 Z)
roost_base_altitude = 65.0  # meters above terrain the roost cruises at
vertical_speed = 0.02      # rad/s; slow Y swoop (0 = flat altitude)
vertical_amplitude = 10.0  # meters above/below base altitude
gravity = 0.015            # pitch-gravity: speed gain/loss per frame along f_y (dive accelerates, climb bleeds)
min_bird_speed = 0.8       # airspeed floor: a starling never stalls to zero in mid-air
dive_speed_mult = 1.35     # max-speed multiplier in a straight-down stoop
climb_speed_mult = 0.65    # max-speed multiplier in a straight-up climb

[hawk]
cruise_speed = 2.5        # AI pack speed, throttle out = 0
boost_speed = 3.5         # AI pack speed, throttle out = +1
slow_factor = 0.45        # throttle out = -1 -> cruise * this
yaw_rate = 80.0           # deg/s, NN output
pitch_rate = 60.0         # deg/s, NN output
roll_speed = 60.0         # deg/s, NN output
max_altitude = 150.0      # sky barrier height (m); needs room for full loops
gravity = 2.2             # pitch-gravity along the flight path: stoop builds speed, climb bleeds it
dive_max_speed = 6.8      # terminal velocity in a steep stoop (above boost_speed)
min_flight_speed = 0.9    # airspeed floor: a hawk never hovers
stall_speed = 1.4         # below this, a nose-up hawk's wings stall and the nose drops
lift_grip = 5.5           # 1/s: how fast the flight path follows the nose (lower = wider swoops, more drift)
induced_drag = 1.8        # airspeed bleed per second of high-AoA slip (sharp turns cost speed)
base_fov = 100.0           # camera FOV at cruise speed
boost_fov = 120.0         # camera FOV at full boost (Shift)

[player]
# Spectator hawk (modes 4/5). Speeds/rates fall back to the [hawk] values
# above when a line here is removed. Keys are Ursina key names: a string
# or a list, e.g. pitch_down_keys = ["w", "up arrow"].
cruise_speed = 1.0        # no throttle keys
boost_speed = 3.5         # boost key held
slow_factor = 0.45        # slow key -> cruise * this
yaw_rate = 80.0           # deg/s, yaw keys
pitch_rate = 60.0         # deg/s, pitch keys
roll_speed = 60.0         # deg/s, roll keys
auto_coord = 0.35         # extra yaw per unit of bank (0 = raw yaw only)
pitch_down_keys = ["w", "up arrow"]
pitch_up_keys = ["s", "down arrow"]
roll_left_keys = ["q", "left arrow"]
roll_right_keys = ["e", "right arrow"]
yaw_left_keys = "a"
yaw_right_keys = "d"
boost_keys = "left shift"
slow_keys = "left control"
reset_keys = "r"

[pack]
population_size = 10        # hawks flying simultaneously each generation
generation_seconds = 45.0   # generation length; then rank -> 3-tiered speciation
mutation_tiny = 0.02        # tier 1: champion lineage (exploitation, fine-tune)
mutation_medium = 0.08      # tier 2: runner-up lineage (balanced exploration)
mutation_heavy = 0.20       # tier 3: wildcard lineage (high-variance lottery)
fitness_catch = 1500.0      # points per catch
proximity_radius = 150.0    # closing within this earns a per-frame bonus (0..1 scaled)
proximity_gain = 3.0        # proximity bonus multiplier per frame
ground_penalty = 0.6        # fitness subtracted per frame under min clearance
ground_clearance = 1.2      # meters above terrain considered a scrape
dogfight_radius = 25.0      # stalking bonus activates inside this range
dogfight_gain = 2.0         # per-frame reward for tail-chasing (range x aim alignment)
boundary_penalty = 0.4      # per-frame penalty for scraping wall/ceiling
boundary_scrape_dist = 15.0  # meters from wall (or below ceiling) counted as scraping
persist = true              # keep evolved weights between runs
save_folder = "evolution"   # folder next to main.py: population.npz + history.csv

[hawk_vs_flock]
panic_radius = 12.0       # birds inside this flee
force_flee = 2.0
panic_max_speed = 3.6     # birds can briefly outrun you
catch_radius = 1.2        # touch = catch, bird respawns

[flock_nn]
num_tribes = 20           # one shared MLP per tribe; birds split into contiguous blocks
mutation_sigma = 0.06     # gaussian noise on offspring tribe weights
replace_deaths = 10       # tribe loses this many birds -> replaced by mutated top-3 parent
casualty_decay = 0.01     # per-second exponential fade of the casualty counter (0 = never decay)

[terrain]
size = 1200               # field width/depth
cell = 1.2                # meters per grid cell (lower = more detail)
amplitude = 15.0          # max hill height
seed = 5                  # change for a different world
roost_clear_radius = 30.0 # flat bowl around the flock
fog_density = 0.024      # visibility falloff

[game]
start_camera = 2          # 1 fixed wide, 2 pack-chase (best hawk), 3 AI first-person (TAB cycles), 4 player chase, 5 player first-person
force_cpu = false         # true = skip GPU even if VRAM looks free

[rabbits]
num_rabbits = 100           # ground prey population (pure NumPy state machine)
num_burrows = 20            # invisible burrows (physics only, never rendered)
flee_radius = 25.0          # hawk closer than this -> Flee (state 3)
freeze_radius = 50.0        # hawk in 25..50m band -> Freeze (state 2)
recover_radius = 30.0       # fleeing rabbit reverts to Vigilance past this (hysteresis)
forage_speed = 0.8          # m/s slow random walk
flee_speed = 6.0            # m/s sprint to the nearest burrow
escape_radius = 1.0         # within this of a burrow -> dive, pop up at another
